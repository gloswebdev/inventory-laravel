<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>No Connection — InvoFlow</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --indigo-50: #eef2ff;
            --indigo-100: #e0e7ff;
            --indigo-400: #818cf8;
            --indigo-500: #6366f1;
            --indigo-600: #4f46e5;
            --indigo-700: #4338ca;
            --indigo-900: #312e81;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
            position: relative;
            padding: 24px;
        }

        /* Animated background blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: drift 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .blob-1 {
            width: 400px; height: 400px;
            background: var(--indigo-600);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 350px; height: 350px;
            background: #7c3aed;
            bottom: -80px; right: -80px;
            animation-delay: -3s;
        }
        .blob-3 {
            width: 250px; height: 250px;
            background: #2563eb;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.08); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 48px 36px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow:
                0 32px 64px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.05) inset;
            animation: card-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Signal icon animation */
        .icon-wrapper {
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(99, 102, 241, 0.4);
            animation: ping 2s ease-out infinite;
        }
        .icon-ring:nth-child(2) { animation-delay: 0.6s; }
        .icon-ring:nth-child(3) { animation-delay: 1.2s; }

        @keyframes ping {
            0%   { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .icon-bg {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(124,58,237,0.3));
            border: 1.5px solid rgba(99,102,241,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* WiFi slash SVG */
        .wifi-icon {
            width: 36px;
            height: 36px;
            animation: shake 3s ease-in-out infinite;
        }
        @keyframes shake {
            0%,100% { transform: rotate(0deg); }
            25%  { transform: rotate(-5deg); }
            75%  { transform: rotate(5deg); }
        }

        /* Status dot */
        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 999px;
            padding: 4px 14px;
            margin-bottom: 20px;
        }
        .status-dot .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f87171;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .status-dot span {
            font-size: 12px;
            font-weight: 600;
            color: #fca5a5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        p {
            font-size: 15px;
            font-weight: 400;
            color: rgba(255,255,255,0.55);
            line-height: 1.65;
            margin-bottom: 32px;
        }

        /* Info chips */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .chip {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            color: rgba(255,255,255,0.65);
            font-weight: 500;
        }
        .chip svg {
            width: 15px; height: 15px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* Retry Button */
        .btn-retry {
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--indigo-600), #7c3aed);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .btn-retry::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
        }
        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(79, 70, 229, 0.55);
        }
        .btn-retry:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .btn-retry.loading svg {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-home {
            width: 100%;
            padding: 13px 24px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            color: rgba(255,255,255,0.7);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .btn-home:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(255,255,255,0.2);
        }

        /* Brand */
        .brand {
            position: relative;
            z-index: 10;
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .brand-logo {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--indigo-500), #7c3aed);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo svg { width: 16px; height: 16px; }
        .brand span {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.3px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }
        .divider-text {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            font-weight: 500;
        }

        /* Timer */
        #retry-timer {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        @media (max-width: 380px) {
            .card { padding: 36px 24px 32px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Card -->
    <div class="card">

        <!-- Pulsing icon -->
        <div class="icon-wrapper">
            <div class="icon-ring"></div>
            <div class="icon-ring"></div>
            <div class="icon-ring"></div>
            <div class="icon-bg">
                <!-- WiFi-off SVG -->
                <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L23 23" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.8" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M10.71 5.05A16 16 0 0 1 22.56 9" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="20" r="1" fill="#818cf8"/>
                </svg>
            </div>
        </div>

        <!-- Status pill -->
        <div class="status-dot">
            <div class="dot"></div>
            <span>Network Offline</span>
        </div>

        <h1>Aap Offline Hain</h1>
        <p>Internet connection nahi mil rahi. Apna WiFi ya Mobile Data check karein aur dobara try karein.</p>

        <!-- Info chips -->
        <div class="chips">
            <div class="chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Data Safe Hai
            </div>
            <div class="chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                </svg>
                Auto Reconnect
            </div>
            <div class="chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                Koi Data Loss Nahi
            </div>
        </div>

        <!-- Retry Button -->
        <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
            <svg id="retryIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Dobara Try Karein
        </button>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">ya</span>
            <div class="divider-line"></div>
        </div>

        <a href="/mobile" class="btn-home">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Home Par Jaayein
        </a>

        <p id="retry-timer"></p>
    </div>

    <!-- Brand Footer -->
    <div class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
        </div>
        <span>InvoFlow — Inventory Manager</span>
    </div>

    <script>
        // ── Generate particles ──────────────────────────────────────────
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left   = Math.random() * 100 + 'vw';
            p.style.width  = (Math.random() * 3 + 1) + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration  = (Math.random() * 12 + 8) + 's';
            p.style.animationDelay     = (Math.random() * 10) + 's';
            p.style.opacity = Math.random() * 0.5 + 0.1;
            container.appendChild(p);
        }

        // ── Retry logic ─────────────────────────────────────────────────
        let countdown = null;

        function retryConnection() {
            const btn  = document.getElementById('retryBtn');
            const icon = document.getElementById('retryIcon');
            const timer = document.getElementById('retry-timer');

            btn.classList.add('loading');
            btn.disabled = true;
            btn.querySelector('span') && (btn.querySelector('span').textContent = 'Check ho raha hai...');
            btn.childNodes[2] && (btn.childNodes[2].textContent = ' Check ho raha hai...');

            // Update button text
            btn.innerHTML = `
                <svg id="retryIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                Check ho raha hai...
            `;

            // Try to fetch a small resource
            fetch('/manifest.json', { cache: 'no-store' })
                .then(() => {
                    // Online! Redirect
                    timer.textContent = '✅ Connection mil gayi! Redirect ho raha hai...';
                    setTimeout(() => { window.location.href = '/mobile'; }, 800);
                })
                .catch(() => {
                    // Still offline
                    btn.disabled = false;
                    btn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                        Dobara Try Karein
                    `;

                    // Countdown timer
                    let secs = 30;
                    timer.textContent = `Abhi bhi offline hai. ${secs}s mein auto-retry...`;
                    clearInterval(countdown);
                    countdown = setInterval(() => {
                        secs--;
                        if (secs <= 0) {
                            clearInterval(countdown);
                            timer.textContent = '';
                            retryConnection();
                        } else {
                            timer.textContent = `Abhi bhi offline hai. ${secs}s mein auto-retry...`;
                        }
                    }, 1000);
                });
        }

        // ── Auto-detect when network comes back ─────────────────────────
        window.addEventListener('online', () => {
            document.getElementById('retry-timer').textContent = '✅ Internet aa gayi! Redirect ho raha hai...';
            setTimeout(() => { window.location.href = '/mobile'; }, 1000);
        });

        // Auto retry after 30s on page load
        setTimeout(retryConnection, 30000);
    </script>
</body>
</html>
